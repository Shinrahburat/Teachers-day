<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HAPPY TEACHERS DAY, BABYYY! ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffb3c6, #ffe5ec);
            font-family: "Segoe UI", Arial, sans-serif;
            text-align: center;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 25px 12px;
        }

        /* FLOATING HEARTS */
        .heart {
            position: fixed;
            bottom: -30px;
            color: #ff2f6d;
            font-size: 22px;
            animation:
                floatUp 8s linear forwards,
                beat 1s infinite alternate;
            opacity: 0.7;
            filter: drop-shadow(0 0 8px rgba(255, 47, 109, 0.7));
            pointer-events: none;
            z-index: 1;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0);
                opacity: 1;
            }

            to {
                transform: translateY(-115vh);
                opacity: 0;
            }
        }

        @keyframes beat {
            0% {
                scale: 1;
            }

            100% {
                scale: 1.3;
            }
        }

        /* INTRO */
        #intro {
            cursor: pointer;
            width: 100%;
        }

        .envelope-container {
            position: relative;
            width: min(88vw, 340px);
            height: min(58vw, 215px);
            margin: 70px auto 0;
            animation: shake 3s infinite;
            filter: drop-shadow(0 0 20px #ff6f91);
        }

        @keyframes shake {
            0%, 100% {
                transform: rotate(0deg);
            }

            25% {
                transform: rotate(1.5deg);
            }

            50% {
                transform: rotate(-1.5deg);
            }

            75% {
                transform: rotate(1.5deg);
            }
        }

        .envelope {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff3f7f, #ff6f91);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(255, 63, 127, 0.55);
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            0% {
                box-shadow: 0 0 25px rgba(255, 63, 127, 0.5);
            }

            100% {
                box-shadow: 0 0 40px rgba(255, 63, 127, 0.8);
            }
        }

        .flap {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;

            border-left: min(44vw, 170px) solid transparent;
            border-right: min(44vw, 170px) solid transparent;
            border-bottom: min(29vw, 108px) solid #ff9ab8;

            transform-origin: top;
            transition: transform 1.2s ease;
        }

        .letter {
            position: absolute;
            width: 88%;
            height: 65%;
            background: #fff5f8;
            top: 25px;
            left: 6%;
            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #ff2f6d;
            font-weight: bold;
            font-size: clamp(28px, 10vw, 42px);

            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            transition: transform 1.3s ease;
        }

        .open .flap {
            transform: translateX(-50%) rotateX(180deg);
        }

        .open .letter {
            transform: translateY(-150px);
        }

        #intro p {
            margin-top: 25px;
            font-size: clamp(18px, 5vw, 22px);
            color: #7a1e3a;
            font-weight: 500;
        }

        /* SPARKLES */
        .sparkle {
            position: fixed;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 14px white;
            animation: sparkle 1.1s ease-out forwards;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes sparkle {
            from {
                opacity: 1;
            }

            to {
                transform:
                    translate(var(--x), var(--y))
                    scale(0);
                opacity: 0;
            }
        }

        /* CARD */
        #card {
            display: none;
            width: 100%;
            margin-top: 30px;
        }

        .card-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        /* SIDE FLOWERS */
        .side-image {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            animation: fadeInSide 1.5s ease forwards;
        }

        @keyframes fadeInSide {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* MAIN CARD */
        .card {
            width: 100%;
            max-width: 380px;
            background: linear-gradient(135deg, #ffffff, #fff0f6);
            padding: 20px 15px;
            border-radius: 25px;
            box-shadow: 0 25px 50px rgba(255, 47, 109, 0.35);
            animation: fadeIn 1.8s ease;
        }

        .image-container {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        img.card-img {
            display: block;
            width: 100%;
            max-width: 330px;
            margin: auto;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        .name-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            color: white;
            font-size: clamp(28px, 9vw, 52px);
            font-weight: bold;
            letter-spacing: 4px;

            text-shadow:
                0 0 20px rgba(255, 255, 255, 0.6),
                2px 2px 12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: #ff2f6d;
            margin-top: 22px;
            font-size: clamp(23px, 7vw, 32px);
            line-height: 1.2;
        }

        .card p {
            color: #6b1f3a;
            font-size: clamp(16px, 4.5vw, 20px);
            line-height: 1.5;
            margin-bottom: 5px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* SMALL PHONES */
        @media (max-width: 380px) {

            body {
                padding: 15px 8px;
            }

            .envelope-container {
                margin-top: 50px;
            }

            .card {
                padding: 15px 10px;
            }

            .side-image {
                width: 90px;
                height: 90px;
            }

            h1 {
                font-size: 22px;
            }

            .card p {
                font-size: 15px;
            }
        }

    </style>
</head>

    <script>

        // FLOATING HEARTS

        setInterval(() => {

            const heart = document.createElement("div");

            heart.className = "heart";

            heart.innerHTML = "💖";

            heart.style.left =
                Math.random() * 100 + "vw";

            heart.style.fontSize =
                Math.random() * 20 + 18 + "px";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 8000);

        }, 500);


        // OPEN ENVELOPE

        function openEnvelope() {

            document
                .getElementById("env")
                .style.animation = "none";


            document
                .querySelector(".envelope")
                .classList.add("open");


            // SPARKLES

            for (let i = 0; i < 35; i++) {

                const sparkle =
                    document.createElement("div");

                sparkle.className = "sparkle";

                sparkle.style.left = "50%";

                sparkle.style.top = "50%";

                sparkle.style.setProperty(
                    "--x",
                    `${Math.random() * 260 - 130}px`
                );

                sparkle.style.setProperty(
                    "--y",
                    `${Math.random() * 260 - 130}px`
                );

                document.body.appendChild(sparkle);

                setTimeout(() => {
                    sparkle.remove();
                }, 1100);

            }


            // SHOW CARD

            setTimeout(() => {

                document
                    .getElementById("intro")
                    .style.display = "none";

                document
                    .getElementById("card")
                    .style.display = "block";

            }, 1500);

        }

    </script>
